{% extends 'dashboard.html' %}


{% block content %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="../static/css/calendar.css">
 
<h1>Calendar</h1>

{% from 'activity_tabs.html' import activity_tabs with context %}
{% call activity_tabs('calendar', 'Calendar') %}
<div class="cal-wrap">
    <div class="cal-card">
        <div class="cal-head">
            <h2 id="calTitle"></h2>
            <div class="cal-nav">
                <select id="calMonth" aria-label="Month"></select>
                <input type="number" id="calYear" min="1000" max="9999" aria-label="Year">
                <button id="calPrev" type="button">&lt; Prev</button>
                <button id="calToday" type="button">Today</button>
                <button id="calNext" type="button">Next &gt;</button>
            </div>
        </div>
            <div class="cal-grid" id="calGrid"></div>
    </div>
 
    <div class="cal-card">
        <div class="side-section">
            <h3>Current</h3>
            <div id="sideCurrent"></div>
        </div>
        <div class="side-section">
            <h3>Upcoming</h3>
            <div id="sideUpcoming"></div>
        </div>
    </div>
</div>
{% endcall %}

<div class="cal-modal-bg" id="calModalBg">
    <div class="cal-modal">
        <h3 id="modalDate"></h3>
        <div id="modalEntries"></div>

        <div class="date-row">
            <div>
                <label for="fStart">Start Date</label>
                <input type="date" id="fStart" min="1000-01-01" max="9999-12-31">
            </div>
            <div>
                <label for="fEnd">End Date</label>
                <input type="date" id="fEnd" min="1000-01-01" max="9999-12-31">
            </div>
        </div>
        <label for="fTag">Tag</label>
        <select id="fTag">
            <option value="holiday">Holiday</option>
            <option value="event">Event</option>
            <option value="exam">Exam</option>
        </select>
        <label for="fLink">Event Link (Optional)</label>
        <input
        type="url"
        id="fLink"
        placeholder="https://example.com"
        >
        <label for="fDesc">Description</label>
        <textarea id="fDesc" maxlength="500" placeholder="Add a description..."></textarea>
 
        <div class="form-error" id="formError"></div>
        <div class="modal-actions">
            <button type="button" class="cal-btn" id="btnClose">Close</button>
            <button type="button" class="cal-btn" id="btnCancelEdit" style="display:none">Cancel edit</button>
            <button type="button" class="cal-btn primary" id="btnSave">Add</button>
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script>window.CALENDAR_API = "{{ url_for('main.calendar_events') }}";</script>
<script src="{{ url_for('static', filename='js/calendar/calendar.js') }}"></script>
{% endblock %}

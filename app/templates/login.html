<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='css/login.css')}}">
</head>
<body>
    <a href="{{ url_for('main.landing') }}" class="back-home">Back to Home</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <aside class="flash-stack">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </aside>
        {% endif %}
    {% endwith %}

    <main class="login-card">
        <div class="brand-logo">
            <img src="{{ url_for('static', filename='images/SchoolLogo.jpg') }}" alt="Bucal II Elementary School logo">
        </div>
        <p class="brand-name">Bucal II Elementary School</p>
        <h1 class="login-title">Login</h1>
        <p class="login-subtitle">Welcome back! Please sign in to continue.</p>

        <!-- Login Form -->
        <form action="{{ url_for('main.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                <label for="username">Username</label>
                <input type="text" name="username" id="username" autocomplete="username" autofocus required>
            </div>

            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" autocomplete="current-password" required>
                <button type="button" id="togglePassword" class="field-toggle" aria-label="Show password" aria-pressed="false">
                    <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
                <span id="capsHint" class="caps-hint" role="status" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 4 12h4v6h8v-6h4z"/></svg>
                    Caps Lock is on
                </span>
            </div>

            <button type="submit" class="btn btn-primary login-button">
                <span>Sign In</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/flash-messages.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
